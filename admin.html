<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Value Picks India - Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
<div id="app" class="max-w-3xl mx-auto"></div>

<script>
const REPO = "cjohnar1-cmd/value-picks-india";
const PASSWORD = "valuepicks2026";
let TOKEN = localStorage.getItem('vp_gh_token') || '';
let products = [];
let productsSha = '';

const app = document.getElementById('app');
function render(html) { app.innerHTML = html; }

function b64EncodeUnicode(str) {
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
    (match, p1) => String.fromCharCode('0x' + p1)));
}
function b64DecodeUnicode(str) {
  return decodeURIComponent(atob(str).split('').map(c =>
    '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
}

async function ghGet(path) {
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    headers: { Authorization: `token ${TOKEN}` }
  });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`GitHub error ${res.status} fetching ${path}`);
  return res.json();
}

async function ghPut(path, base64Content, message, sha) {
  const body = { message, content: base64Content, branch: "main" };
  if (sha) body.sha = sha;
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    method: 'PUT',
    headers: {
      Authorization: `token ${TOKEN}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(`GitHub save failed: ${err.message}`);
  }
  return res.json();
}

function showPasswordScreen() {
  render(`
    <div class="bg-white p-8 rounded-xl shadow mt-20 max-w-sm mx-auto">
      <h1 class="text-xl font-bold mb-4">Admin Login</h1>
      <input id="pwInput" type="password" placeholder="Password" class="border p-2 w-full rounded mb-3">
      <button onclick="checkPassword()" class="bg-blue-600 text-white px-4 py-2 rounded w-full">Login</button>
      <p id="pwError" class="text-red-600 text-sm mt-2"></p>
    </div>
  `);
}

function checkPassword() {
  const val = document.getElementById('pwInput').value;
  if (val === PASSWORD) {
    if (!TOKEN) { showTokenScreen(); } else { loadDashboard(); }
  } else {
    document.getElementById('pwError').innerText = "Wrong password";
  }
}

function showTokenScreen() {
  render(`
    <div class="bg-white p-8 rounded-xl shadow mt-20 max-w-md mx-auto">
      <h1 class="text-xl font-bold mb-4">One-time setup: Paste GitHub Token</h1>
      <p class="text-sm text-gray-600 mb-3">This is stored only in your browser. Paste the token you copied from GitHub.</p>
      <input id="tokenInput" type="text" placeholder="ghp_xxxxxxxxxxxx" class="border p-2 w-full rounded mb-3">
      <button onclick="saveToken()" class="bg-blue-600 text-white px-4 py-2 rounded w-full">Save & Continue</button>
      <p id="tokenError" class="text-red-600 text-sm mt-2"></p>
    </div>
  `);
}

function saveToken() {
  const val = document.getElementById('tokenInput').value.trim();
  if (!val) { document.getElementById('tokenError').innerText = "Please paste a token"; return; }
  TOKEN = val;
  localStorage.setItem('vp_gh_token', TOKEN);
  loadDashboard();
}

async function loadDashboard() {
  render(`<div class="text-center mt-20">Loading products from GitHub...</div>`);
  try {
    const file = await ghGet('products.json');
    productsSha = file.sha;
    const jsonStr = b64DecodeUnicode(file.content);
    const data = JSON.parse(jsonStr);
    products = data.products;
    renderDashboard();
  } catch (e) {
    render(`<div class="text-red-600 p-4">Error loading products: ${e.message}
      <br><button onclick="loadDashboard()" class="underline mt-2">Retry</button>
      <br><button onclick="resetToken()" class="underline mt-2">Reset Token</button></div>`);
  }
}

function resetToken() {
  localStorage.removeItem('vp_gh_token');
  TOKEN = '';
  showTokenScreen();
}

function renderDashboard() {
  const rows = products.map((p, i) => `
    <tr class="border-b">
      <td class="p-2 font-mono">${p.code}</td>
      <td class="p-2">${p.name}</td>
      <td class="p-2">${p.imageName ? '✅' : '❌'}</td>
      <td class="p-2"><button onclick="editProduct(${i})" class="text-blue-600 underline">Edit</button></td>
    </tr>
  `).join('');

  render(`
    <div class="bg-white p-6 rounded-xl shadow">
      <div class="flex justify-between items-center mb-4">
        <h1 class="text-xl font-bold">Value Picks India — Admin</h1>
        <button onclick="showAddNew()" class="bg-green-600 text-white px-4 py-2 rounded">+ Add New Product</button>
      </div>
      <table class="w-full text-sm">
        <thead><tr class="text-left border-b font-bold">
          <td class="p-2">Code</td><td class="p-2">Name</td><td class="p-2">Image?</td><td class="p-2">Action</td>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `);
}

function editProduct(index) {
  render(formHtml(products[index], index, false));
}

function showAddNew() {
  const blank = {code:'', name:'', publishDate:'', amazonLink:'', imageName:'', description:'', whyWePicked:'', goodToKnow:'', howToUse:''};
  render(formHtml(blank, -1, true));
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formHtml(p, index, isNew) {
  return `
    <div class="bg-white p-6 rounded-xl shadow max-w-2xl mx-auto">
      <button onclick="loadDashboard()" class="text-blue-600 underline mb-4">&larr; Back to list</button>
      <h1 class="text-lg font-bold mb-4">${isNew ? 'Add New Product' : 'Edit ' + p.code}</h1>
      <div class="space-y-3">
        <div><label class="text-sm font-bold">Code</label>
          <input id="f_code" value="${p.code}" ${isNew ? '' : 'readonly'} class="border p-2 w-full rounded ${isNew ? '' : 'bg-gray-100'}"></div>
        <div><label class="text-sm font-bold">Name</label>
          <input id="f_name" value="${escapeHtml(p.name)}" class="border p-2 w-full rounded"></div>
        <div><label class="text-sm font-bold">Publish Date (YYYY-MM-DD)</label>
          <input id="f_publishDate" value="${p.publishDate}" class="border p-2 w-full rounded"></div>
        <div><label class="text-sm font-bold">Amazon Link</label>
          <input id="f_amazonLink" value="${escapeHtml(p.amazonLink)}" class="border p-2 w-full rounded"></div>
        <div><label class="text-sm font-bold">Description</label>
          <textarea id="f_description" class="border p-2 w-full rounded" rows="3">${escapeHtml(p.description)}</textarea></div>
        <div><label class="text-sm font-bold">Why We Picked</label>
          <textarea id="f_whyWePicked" class="border p-2 w-full rounded" rows="3">${escapeHtml(p.whyWePicked)}</textarea></div>
        <div><label class="text-sm font-bold">Good To Know</label>
          <textarea id="f_goodToKnow" class="border p-2 w-full rounded" rows="3">${escapeHtml(p.goodToKnow)}</textarea></div>
        <div><label class="text-sm font-bold">How To Use</label>
          <textarea id="f_howToUse" class="border p-2 w-full rounded" rows="2">${escapeHtml(p.howToUse)}</textarea></div>
        <div><label class="text-sm font-bold">Current Image</label>
          <div class="text-sm text-gray-600 mb-1">${p.imageName || 'None yet'}</div>
          <input id="f_imageFile" type="file" accept="image/*" class="border p-2 w-full rounded"></div>
        <div id="formMsg" class="text-sm"></div>
        <button onclick="saveProduct(${index}, ${isNew})" class="bg-blue-600 text-white px-4 py-2 rounded w-full">
          Save to Live Site
        </button>
      </div>
    </div>
  `;
}

async function saveProduct(index, isNew) {
  const msgEl = document.getElementById('formMsg');
  msgEl.innerText = 'Saving... please wait';
  msgEl.className = 'text-blue-600 text-sm';

  try {
    const code = document.getElementById('f_code').value.trim();
    if (!code) throw new Error('Product code is required');

    const newProduct = {
      code: code,
      name: document.getElementById('f_name').value,
      publishDate: document.getElementById('f_publishDate').value,
      amazonLink: document.getElementById('f_amazonLink').value,
      imageName: isNew ? '' : products[index].imageName,
      description: document.getElementById('f_description').value,
      whyWePicked: document.getElementById('f_whyWePicked').value,
      goodToKnow: document.getElementById('f_goodToKnow').value,
      howToUse: document.getElementById('f_howToUse').value
    };

    const fileInput = document.getElementById('f_imageFile');
    if (fileInput.files && fileInput.files[0]) {
      msgEl.innerText = 'Uploading image...';
      const file = fileInput.files[0];
      const ext = file.name.split('.').pop();
      const imageName = `${code}.${ext}`;
      const base64Data = await fileToBase64(file);

      const existing = await ghGet(`images/${imageName}`);
      await ghPut(`images/${imageName}`, base64Data, `Update image for ${code}`, existing ? existing.sha : null);

      newProduct.imageName = imageName;
    }

    if (isNew) {
      if (products.find(p => p.code === code)) throw new Error('This product code already exists');
      products.push(newProduct);
    } else {
      products[index] = newProduct;
    }

    msgEl.innerText = 'Saving product data...';
    const updatedJson = JSON.stringify({ products }, null, 2);
    const encoded = b64EncodeUnicode(updatedJson);
    const result = await ghPut('products.json', encoded, `Update product ${code}`, productsSha);
    productsSha = result.content.sha;

    msgEl.innerText = '✅ Saved! Your live site will update within about 1 minute.';
    msgEl.className = 'text-green-600 text-sm font-bold';

    setTimeout(loadDashboard, 2000);

  } catch (e) {
    msgEl.innerText = '❌ Error: ' + e.message;
    msgEl.className = 'text-red-600 text-sm';
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

showPasswordScreen();
</script>
</body>
</html>
